name: alpha release evidence

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.ref_name }}
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}-${{ matrix.name }}@${{ steps.image.outputs.digest }}
          artifact-name: clef-${{ matrix.name }}-${{ github.ref_name }}.spdx.json
          output-file: clef-${{ matrix.name }}-${{ github.ref_name }}.spdx.json
      - name: Write image evidence
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: jq -n --arg image "$IMAGE_NAME" --arg digest "$IMAGE_DIGEST" --arg revision "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" '{image:$image,digest:$digest,revision:$revision,ref:$ref}' > "clef-${IMAGE_NAME}-${GITHUB_REF_NAME}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.name }}
          path: |
            clef-${{ matrix.name }}-${{ github.ref_name }}.spdx.json
            clef-${{ matrix.name }}-${{ github.ref_name }}.json

  prerelease:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-evidence-*
          merge-multiple: true
          path: release-evidence
      - name: Create immutable alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title "Clef Rights Node $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" --clobber release-evidence/*
